[package]
name = "soundscope"
version = "1.10.0"
edition = "2024"
description = "A TUI for real-time analysis of audio files, system audio, and microphone input"
repository = "https://github.com/bananaofhappiness/soundscope"
license = "MIT"
readme = "README.md"
keywords = ["audio", "command-line", "cli"]

[dependencies]
bitflags = "2.13.1"
cpal = "0.16.0"
crossbeam = "0.8.4"
crossterm = "0.29.0"
dirs = "6.0.0"
ebur128 = "0.1.10"
eyre = "0.6.12"
ratatui = {version = "0.30.1", features = ["serde", "unstable-widget-ref"]}
ratatui-explorer = "0.3.0"
ringbuffer = "0.16.0"
rodio = {version = "0.21.1", features = ["symphonia-all"]}
serde = { version = "1.0.225", features = ["derive"] }
spectrum-analyzer = "1.9.0"
symphonia = { version = "0.5.4" }
toml = "0.9.6"
tui-big-text = "0.8.2"


# [patch.crates-io]
# ratatui = {path = "../ratatui/ratatui"}
# ratatui-core = {path = "../ratatui/ratatui-core"}
# ratatui-widgets = {path = "../ratatui/ratatui-widgets"}
# ratatui-termwiz = {path = "../ratatui/ratatui-termwiz"}
# ratatui-macros = {path = "../ratatui/ratatui-macros"}
# ratatui-termion = {path = "../ratatui/ratatui-termion"}
# ratatui-crossterm = {path = "../ratatui/ratatui-crossterm"}

[profile.release]
strip = true
codegen-units = 1
panic = "abort"
lto = "thin"

[profile.profiling]
inherits = "release"
debug = 1
strip = false

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-core-audio = "0.3.2"
objc2-core-audio-types = "0.3.2"
objc2-core-foundation = { version = "0.3.2", features = [
    "CFArray",
    "CFDictionary",
    "CFNumber",
    "CFString",
] }
objc2-foundation = "0.3.2"
